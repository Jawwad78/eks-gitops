apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: cert-manager
  labels:
    app: {{ .Values.app.name }}
spec:
  replicas: 3
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels: 
        app: {{ .Values.app.name }}
    spec:
      containers:
      - name:  {{ .Values.app.name }}
        image: {{ .Values.container.image }}
        ports:
        - containerPort: {{ .Values.port.containerPort }}
        readinessProbe:
          httpGet: { path: "/", port: 80 }
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: "/", port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi" 
            cpu: "250m"
          limits:   
            memory: "128Mi"  
            cpu: "500m"
