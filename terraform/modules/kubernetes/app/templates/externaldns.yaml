apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  
  labels:
    app.kubernetes.io/name: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          args:
            - --source=ingress
            - --domain-filter=jawwad.org #externaldns will only manage records for this doman and its subdomains
            - --provider=aws
            - --policy=sync #change to upsert-only, if you do NOT WANT EXTERNAL DNS to delete records
            - --aws-zone-type=public 
            - --registry=txt
            - --txt-owner-id=my-hostedzone-identifier
            - --zone-id-filter=Z02961562YZEMBNSY5HGH
          env:
            - name: AWS_DEFAULT_REGION
              value: eu-west-2 
    
     